<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartu</title>
    <style>
        body {
            background-color: #f4f4f4;
            font-family: arial, sans-serif;
        }

        .kartu {
            background-color: white;
            width: 300px;
            margin: 50px auto;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #ddd;
        }

        .foto {
            border-radius: 50%;
            margin-bottom: 15px;
            
        }

        .pekerjaan {
            color: gray;
            margin-top: -10px;

        }

        .btn-kontak {
           background-color:rgb(15, 15, 66);
           border-radius: 10px;
            color: white;
            padding: 15px 25px; /* lebar + Jarak Anatar teks dengan border */
            font-size: 14px;
            border: none;
            cursor: pointer;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="kartu">
        <img src="WhatsApp Image 2026-11-02 at 08.32.57.jpeg" alt="Foto Profil" class="foto" width="200" height="200">
        <h2>Budi Santoso</h2>
        <p class="pekerjaan">Web Developer</p>
        <p>Siswa X RPL yang bercita-cita membuat startup teknologi di Indonesia.</p>
        <button class="btn-kontak">Hubungi Saya</button>
    </div>

</body>
</html>
