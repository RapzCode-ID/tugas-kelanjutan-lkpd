<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regis</title>
</head>
<body>
    <h2>Form Registrasi</h2>

    <label for="name">Nama Lengkap:</label>
    <input type="text" id="name" name="name" placeholder="Masukan Nama Anda" required><br>

    <label for="tglh">Tanggal Lahir:</label>
    <input type="date" id="tglh" name="tglh" placeholder="Masukan Tanggal Lahir" required><br>

    <label for="number">Nomor HP/WA:</label>
    <input type="tel" id="number" name="number" placeholder="Masukan Nomor HP/WA" required><br>

    <button type="submit">Submit</button>
</body>
</html>
